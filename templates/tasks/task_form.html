{% extends "base.html" %}


{% block title %}
    {% if object %}
        Edit Task
    {% else %}
        Add Task
    {% endif %}
{% endblock %}


{% block content %}

    <div class="card">

        {% if object %}

            <h1>Edit Task</h1>

            <p class="subtitle">
                Update your task.
            </p>

        {% else %}

            <h1>Add Task</h1>

            <p class="subtitle">
                Create a new task.
            </p>

        {% endif %}


        <form method="post" class="form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save
            </button>

        </form>


        <a
            href="{% url 'tasks:task-list' %}"
            class="back-link"
        >
            Back to tasks
        </a>

    </div>

{% endblock %}
