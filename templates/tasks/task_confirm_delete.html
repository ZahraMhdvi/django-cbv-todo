{% extends "base.html" %}


{% block title %}
    Delete Task
{% endblock %}


{% block content %}

    <div class="card">

        <h1>Delete Task</h1>

        <p class="subtitle">
            Are you sure you want to delete
            <strong>{{ object.title }}</strong>?
        </p>


        <form method="post">

            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Delete
            </button>

        </form>


        <a
            href="{% url 'tasks:task-list' %}"
            class="back-link"
        >
            Cancel
        </a>

    </div>

{% endblock %}
