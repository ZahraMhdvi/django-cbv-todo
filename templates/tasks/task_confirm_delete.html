<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Task</title>
</head>

<body>

    <h1>Delete Task</h1>

    <p>
        Are you sure you want to delete "{{ object.title }}"?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">
            Delete
        </button>
    </form>

    <a href="{% url 'tasks:task-list' %}">
        Cancel
    </a>

</body>
</html>
