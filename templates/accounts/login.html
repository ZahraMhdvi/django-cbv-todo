{% extends "base.html" %}


{% block title %}
    Login | Todo
{% endblock %}


{% block content %}

    <div class="card auth-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to manage your tasks.
        </p>

        <form method="post" class="form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Login
            </button>

        </form>

    </div>

{% endblock %}
